# Capability manifest, read by trust-card (capability layer) and any
# capability-based sandbox. Declares what this skill's shipped files do
# when run. Edits the agent makes while following the guidance are the
# agent's capability, not this artifact's.
model: executable
executes: true              # ships scripts/card.py
network: cosign-subprocess   # only when keyless signing shells out to cosign
shell: true                 # subprocess for cosign; never os.system on input
filesystem_writes: true     # writes CARD.md, the manifest, and local signing keys
