owner: game-design

should_fire:
  - is this mechanic fun, or is there a dominant strategy
  - help me design the core loop for my roguelite
  - rework our crafting system, it feels grindy and pointless
  - what is the core dialectic of this game idea
  - how should meta-progression work so runs stay interesting instead of just easier
  - critique my deckbuilder's reward draft
  - I'm building a game and need to decide how the loadout budget should work
  - compare how Hades and Slay the Spire handle meta-progression
  - design an enemy telegraph so combat feels fair instead of random
  - our in-game economy is inflating, players have way too much gold
  - how should I lay out my game's pause menu and settings screen
  - design an onboarding tutorial that teaches the player without walls of text
  - should my game's HUD be diegetic or just a normal overlay
  - our dialogue choices feel like they don't matter, how do I fix the illusion of choice
  - what accessibility options should my game ship, like assist modes and captions
  - how do I guide the player toward the objective without a quest marker
  - design the death and results screens for my roguelite
  - how should I show button prompts so they match the player's controller and remapped keys
  - what kind of screen transition should I use moving room to room in my roguelike
  - should the music crossfade, duck, or cut when the player opens the pause menu
  - should my inventory be a grid puzzle, a weight limit, or just unlimited slots
  - design a loot rarity and itemization system for my action RPG
  - my players hoard consumables and never use them, how do I fix that
  - how should equipment slots and set bonuses work without making one build mandatory

# Design asks embedded in a live Godot coding session, the case the skill keeps missing.
# Run with --samples 5 to read these as a trigger rate, not a binary.
in_context:
  - |-
    (Mid-session in a Godot project. Just edited EnemySpawner.gd and ran the godot MCP to validate.)
    User: compiles fine. but by wave 5 the enemies are bullet sponges and it stops being fun. what should the actual scaling curve be?
  - |-
    (Working in a Godot project, ShopMenu.tscn open, just wired up the buy button.)
    User: the shop UI works now. what should it actually sell, and at what prices, so it doesn't wreck the economy?
  - |-
    (In a Godot project tuning combat values in Weapon.gd.)
    User: I set the sword to 12 damage and the bow to 7. does that feel right or am I just guessing numbers?
  - |-
    (Building the inventory system in a Godot project, Inventory.gd open.)
    User: should I cap this by slots, by weight, or a grid? trying to decide before I write the container code.
  - |-
    (Mid-session in a Godot project, just scaffolded the MainMenu.tscn nodes.)
    User: the menu nodes are in. how should the flow from the main menu into a loaded save actually feel?
  - |-
    (Pairing on a Godot project between coding tasks.)
    User: before I write more, can we brainstorm the core loop? I want to be sure the dodge-and-loot idea holds up.

route_to_sibling:
  - prompt: write typed GDScript for an enemy state machine in Godot
    expect: godot
  - prompt: fix the null reference error in EnemySpawner.gd when the object pool is empty
    expect: godot
  - prompt: my CharacterBody2D isn't colliding with the TileMap, what is wrong with the physics layers
    expect: godot
  - prompt: this settings form is confusing for users, help me rethink the flow
    expect: ask-ux
  - prompt: redesign the checkout flow on our web app, it has a high drop-off
    expect: ask-ux

should_not_fire:
  - set up TanStack Query for this API
  - rewrite this ticket as a user story
